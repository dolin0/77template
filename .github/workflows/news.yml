name: Update entertainment news

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */2 * * *'

permissions:
  contents: write

concurrency:
  group: entertainment-news-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect news
        run: python collect_news.py
      - name: Filter unrelated and duplicate articles
        run: python filter_news.py
      - name: Save news to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if ! git diff --cached --quiet; then
            git commit -m "Update entertainment news data"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No news changes"
          fi
