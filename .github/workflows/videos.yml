
name: Update official YouTube videos

on:
  workflow_dispatch:
  schedule:
    - cron: '41 */3 * * *'

permissions:
  contents: write

concurrency:
  group: entertainment-video-data
  cancel-in-progress: false

jobs:
  fetch-videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect YouTube official channel RSS feeds
        run: python collect_videos.py
      - name: Commit video data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos.json
          if ! git diff --cached --quiet; then
            git commit -m "Update official YouTube videos"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No video data changes"
          fi
