<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111318"><title>AI 콘텐츠 도우미 | 77 MAGAZINE STUDIO</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;--bg:#0c0d10;--panel:#17191f;--border:#343843;--muted:#a9adbb;--accent:#b4c9ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f7f8fb}header{border-bottom:1px solid var(--border);padding:17px max(16px,calc((100vw - 1020px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{color:white;font-size:17px;font-weight:800;text-decoration:none}.nav{display:flex;gap:8px}.nav a{color:#dce3f5;background:#25272e;padding:10px 12px;text-decoration:none;border:1px solid var(--border);border-radius:9px;font-size:13px;font-weight:700}main{max-width:780px;margin:auto;padding:30px 17px 70px}.eyebrow{color:var(--accent);font-size:12px;font-weight:800}h1{font-size:clamp(25px,5vw,34px);margin:7px 0 8px}.lead,.note{color:var(--muted);line-height:1.65;font-size:14px}.panel{background:var(--panel);border:1px solid var(--border);border-radius:13px;padding:20px;margin-top:22px}label{display:block;font-size:14px;font-weight:700;margin:16px 0 7px}input,textarea,select{background:#22252d;border:1px solid #454955;color:white;border-radius:9px;padding:12px;font:inherit;width:100%;outline:none}textarea{min-height:130px;resize:vertical;line-height:1.55}input:focus,textarea:focus,select:focus{border-color:var(--accent)}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:19px}button,a.action{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:9px;background:#d7e2ff;color:#131c2d;font-size:14px;font-weight:800;padding:13px 16px;cursor:pointer;text-decoration:none}.secondary{background:#343944;color:white;border:1px solid #555c69}.status{font-size:13px;color:#bcd1ff;min-height:20px;margin-top:12px}.note{font-size:12px}.output{white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.6;max-height:310px;overflow:auto;background:#111318;border-radius:9px;border:1px solid var(--border);padding:13px;margin-top:15px} [hidden]{display:none!important}@media(max-width:530px){.nav{width:100%;display:grid;grid-template-columns:1fr 1fr}.nav a{text-align:center}.panel{padding:16px}.actions>*{flex:1}}
</style></head><body><header><a class="brand" href="./index.html">77 MAGAZINE STUDIO</a><nav class="nav"><a href="./index.html">사진 편집기</a><a href="./news.html">연예 뉴스</a></nav></header><main><div class="eyebrow">77 MAGAZINE · CONTENT ASSISTANT</div><h1>AI 기사·캡션 도우미</h1><p class="lead">기사 정보를 넣으면 ChatGPT에 붙여넣을 요청문을 만들어줘. AI API 연결 없이 무료로 시작하는 방식이야.</p><section class="panel"><label for="title">기사 제목 *</label><input id="title" maxlength="300" placeholder="예: 아이돌 그룹의 새 앨범 발매 발표"><label for="source">언론사 / 출처</label><input id="source" maxlength="100" placeholder="예: 공식 홈페이지 또는 기사 언론사"><label for="url">기사 링크</label><input id="url" type="url" placeholder="https://..."><label for="details">확인된 기사 내용 또는 핵심 사실</label><textarea id="details" placeholder="기사의 핵심 사실을 직접 요약해 붙여넣어 줘. 링크만으로는 ChatGPT가 원문을 읽지 못할 수 있어."></textarea><label for="tone">문체</label><select id="tone"><option value="감각적이지만 과장하지 않는 아이돌 매거진 톤">매거진 스타일</option><option value="정확하고 중립적인 뉴스 톤">뉴스 스타일</option><option value="밝고 친근한 팬 친화적 톤">팬 친화형</option></select><div class="actions"><button type="button" id="copy">AI 요청문 복사</button><a class="action secondary" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">ChatGPT 열기 ↗</a></div><div id="status" class="status" role="status" aria-live="polite"></div><div id="preview" class="output" hidden></div></section><p class="note">사용 방법: 기사 정보를 입력 → ‘AI 요청문 복사’ → ChatGPT 열기 → 붙여넣고 전송. 확인되지 않은 소문은 사실처럼 작성하지 않도록 요청문에 포함돼 있어. 원문이나 사진을 그대로 재게시하기 전에 이용 권한을 확인해.</p></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);function build(){const title=$('title').value.trim(),details=$('details').value.trim(),source=$('source').value.trim(),url=$('url').value.trim();if(!title){$('status').textContent='먼저 기사 제목을 입력해 줘.';$('title').focus();return null}return `너는 한국 아이돌·연예 매거진의 콘텐츠 에디터야. 아래 정보만을 근거로 인스타그램 콘텐츠 초안을 작성해 줘.\n\n[기사 제목]\n${title}\n\n[출처]\n${source||'미입력'}\n\n[원문 링크]\n${url||'미입력'}\n\n[제공된 핵심 사실]\n${details||'제공되지 않음. 제목 외 사실은 추가하지 마.'}\n\n[문체]\n${$('tone').value}\n\n다음 순서로 작성해 줘.\n1) 피드 썸네일용 제목 5개 (각각 최대 2줄, 짧고 명확하게)\n2) 부제목 3개 (각각 1줄)\n3) 인스타 캡션 2개 (짧은 버전/정보형 버전)\n4) 해시태그 8개 이내\n5) 게시 전 확인이 필요한 정보 목록\n\n중요: 제공되지 않은 날짜, 숫자, 인용, 인물 관계를 지어내지 마. 루머와 공식 발표를 구분하고 확실하지 않은 내용은 불확실하다고 표시해. 기사 문장을 길게 복제하지 말고 독자적인 문장으로 다시 작성해. 원문 링크가 있어도 확인할 수 없으면 읽은 척하지 마.`} $('copy').addEventListener('click',async()=>{const prompt=build();if(!prompt)return;$('preview').hidden=false;$('preview').textContent=prompt;try{await navigator.clipboard.writeText(prompt);$('status').textContent='복사 완료! 이제 ChatGPT를 열고 붙여넣으면 돼.'}catch(e){$('status').textContent='자동 복사를 지원하지 않는 브라우저야. 아래 요청문을 길게 눌러 직접 복사해 줘.'}})})();
</script></body></html>
